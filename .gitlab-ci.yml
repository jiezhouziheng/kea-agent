stages:
  - test

verify:
  stage: test
  image: oven/bun:1.3.7
  timeout: 20m
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun/install/cache/
  variables:
    BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun/install/cache"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
  script:
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun test
    - bun run build
    - bun run verify:dist
    - bun run verify:global
